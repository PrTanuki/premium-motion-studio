name: Render motion on demand
on:
  push:
    branches: [verify-remote-render]
  workflow_dispatch:
    inputs:
      composition:
        description: Approved composition
        required: true
        type: choice
        options: [PremiumDemo01]
permissions:
  contents: read
concurrency:
  group: motion-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/remotion/package-lock.json
      - name: Validate requested composition
        env:
          COMPOSITION: ${{ inputs.composition || 'PremiumDemo01' }}
        run: test "$COMPOSITION" = PremiumDemo01
      - run: npm run validate:brief
      - run: npm ci
        working-directory: apps/remotion
      - run: npm run check
        working-directory: apps/remotion
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run render:demo
      - uses: actions/upload-artifact@v4
        with:
          name: premium-demo-01
          path: |
            out/premium-demo-01.mp4
            out/contact-sheet.png
            out/stills/
            out/metadata.json
          if-no-files-found: error
          retention-days: 7
