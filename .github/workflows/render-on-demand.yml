name: Render motion on demand
on:
  workflow_dispatch:
    inputs:
      composition:
        description: Approved composition
        required: true
        type: choice
        options: [PremiumDemo01, CNARMRecruitment01]
permissions:
  contents: read
concurrency:
  group: motion-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/remotion/package-lock.json
      - name: Validate requested composition
        env:
          COMPOSITION: ${{ inputs.composition }}
        run: |
          case "$COMPOSITION" in
            PremiumDemo01|CNARMRecruitment01) ;;
            *) echo "Unsupported composition" >&2; exit 1 ;;
          esac
      - run: npm run validate:brief
      - run: npm run validate:cnarm
      - run: npm ci
        working-directory: apps/remotion
      - run: npm run check
        working-directory: apps/remotion
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==11.3.0
      - name: Render original demo
        if: inputs.composition == 'PremiumDemo01'
        run: npm run render:demo
      - name: Render CNARM and verify encoded frames
        if: inputs.composition == 'CNARMRecruitment01'
        run: |
          npm run render:cnarm
          cp docs/cnarm/QA-REPORT.md out/cnarm/QA-REPORT.md
          cp briefs/cnarm-recruitment-01.json out/cnarm/brief.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}
          path: |
            out/
          if-no-files-found: error
          retention-days: 7
