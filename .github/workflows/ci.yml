name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/remotion/package-lock.json
      - run: npm run validate:brief
      - run: npm ci
        working-directory: apps/remotion
      - run: npm run check
        working-directory: apps/remotion
